modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "MIT"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
logoFile = "assets/${mod_id}/icon.png"
description = '''The French railway universe for Minecraft Transit Railway: signage, logos, station equipment and rolling stock inspired by the SNCF, RATP and Ile-de-France Mobilites networks.
L'univers ferroviaire francais pour Minecraft Transit Railway : signaletique, logos, equipements de gare et materiel roulant inspires des reseaux SNCF, RATP et Ile-de-France Mobilites.

Created by the French community - Cree par la communaute francaise.'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mtr"
mandatory = true
versionRange = "${mtr_version_range}"
ordering = "AFTER"
side = "BOTH"
